name: HNL Tablica Scraper

on:
  schedule:
    # NAPOMENA: cron vremena su u UTC. Hrvatska je UTC+2 (ljeti, CEST) ili UTC+1 (zimi, CET),
    # pa su navedeni lokalni satni ekvivalenti točni za ljetno vrijeme (ožujak–listopad);
    # zimi (studeni–ožujak) sve padne sat vremena ranije po hrvatskom vremenu.

    # Pon–Čet: jednom dnevno, 06:00 UTC (~08:00 ljeti / ~07:00 zimi po hrv. vremenu)
    - cron: '0 6 * * 1-4'
    # Pet–Ned: svaka 2 sata preko dana, 07–21h UTC (~09–23h ljeti / ~08–22h zimi po hrv. vremenu)
    # — tada se igraju kola, pa se tablica/strijelci češće mijenjaju
    - cron: '0 7-21/2 * * 5,6,0'
  workflow_dispatch: {}   # omogućuje ručno pokretanje gumbom "Run workflow"

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tablica-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaliraj ovisnosti
        run: npm install

      - name: Pokreni scraper
        run: node index.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
